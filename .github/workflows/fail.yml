name: e2e-fail-test
on:
  push:
    paths:
      - '.github/workflows/fail.yml'
  workflow_dispatch:

jobs:
  always-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose
        run: |
          echo "This step intentionally fails to validate the"
          echo "WF-GH-Discord pipeline failure path (@dev-alerts mention)."
          exit 1
